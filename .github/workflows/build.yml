name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen generate
      - name: Build and test
        run: |
          xcodebuild -project Posty.xcodeproj -scheme Posty \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            test
      - name: Package development build
        run: ditto -c -k --keepParent DerivedData/Build/Products/Debug/Posty.app build/Posty-development.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Posty-development-${{ github.sha }}
          path: |
            build/Posty-development.zip
            build/Tests.xcresult
          retention-days: 7
