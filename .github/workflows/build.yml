name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare build tools
        id: toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          xcodegen generate
      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Posty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
      - name: Resolve locked dependencies
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          xcodebuild -resolvePackageDependencies -project Posty.xcodeproj -scheme Posty \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates
          git diff --exit-code -- Posty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Save Swift packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache compiler results, never signed products, archives, or credentials.
          path: DerivedData/CompilationCache.noindex
          key: compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-test-${{ steps.toolchain.outputs.commit }}
          restore-keys: |
            compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-test-
            compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
      - name: Build and test
        run: |
          xcodebuild -project Posty.xcodeproj -scheme Posty \
            -configuration Debug -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_CAS_PATH="$PWD/DerivedData/CompilationCache.noindex" \
            -derivedDataPath DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            test
      - name: Save compiler cache
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/CompilationCache.noindex
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - name: Package development build
        run: ditto -c -k --keepParent DerivedData/Build/Products/Debug/Posty.app build/Posty-development.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Posty-development-${{ github.sha }}
          path: |
            build/Posty-development.zip
            build/Tests.xcresult
          compression-level: 0
          retention-days: 7
