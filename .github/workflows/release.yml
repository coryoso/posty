name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Use a stable version tag such as v0.1.0.' >&2
            exit 1
          }
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          jq -e '.isDraft == false' "$RUNNER_TEMP/release.json"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "PRERELEASE=$(jq -r .isPrerelease "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Prepare build tools
        id: toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          xcodegen generate
      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Posty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
      - name: Resolve locked dependencies
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          xcodebuild -resolvePackageDependencies -project Posty.xcodeproj -scheme Posty \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates
          git diff --exit-code -- Posty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Save Swift packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache compiler results, never signed products, archives, or credentials.
          path: DerivedData/CompilationCache.noindex
          key: compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-release-${{ steps.toolchain.outputs.commit }}
          restore-keys: |
            compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-release-
            compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
      - name: Test
        run: |
          xcodebuild -project Posty.xcodeproj -scheme Posty \
            -configuration Debug -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_CAS_PATH="$PWD/DerivedData/CompilationCache.noindex" \
            -derivedDataPath DerivedData CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO test
      - name: Install signing and notarization credentials
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          for name in APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID HOMEBREW_TAP_DEPLOY_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/posty-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$RUNNER_TEMP/DeveloperIDCA.cer"
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$keychain" -t cert
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain"
          xcrun notarytool store-credentials posty --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --keychain "$keychain"
          rm "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
      - name: Archive universal app
        run: |
          xcodebuild -project Posty.xcodeproj -scheme Posty -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_CAS_PATH="$PWD/DerivedData/CompilationCache.noindex" \
            -archivePath build/Posty.xcarchive 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          app=build/Posty.xcarchive/Products/Applications/Posty.app
          codesign --verify --deep --strict --verbose=2 "$app"
          for executable in "$app/Contents/MacOS/Posty" "$app/Contents/MacOS/PostySSHAskPass"; do
            architectures=" $(lipo -archs "$executable") "
            [[ "$architectures" == *" arm64 "* && "$architectures" == *" x86_64 "* ]]
            codesign --verify --strict "$executable"
            codesign -dv --verbose=2 "$executable" 2>&1 | tee build/signature.txt
            grep -q 'Authority=Developer ID Application: Cornelius Carl (JD26ZWJ4WW)' build/signature.txt
            grep -q 'flags=.*runtime' build/signature.txt
            grep -q '^Timestamp=' build/signature.txt
          done
      - name: Save compiler cache
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/CompilationCache.noindex
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - name: Notarize and staple
        run: |
          app=build/Posty.xcarchive/Products/Applications/Posty.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Posty-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Posty-notarization.zip" \
            --keychain-profile posty --keychain "$RUNNER_TEMP/posty-signing.keychain-db" \
            --wait --timeout 25m --output-format json > build/notarization.json
          jq -e '.status == "Accepted"' build/notarization.json
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Package and upload release
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Posty.xcarchive/Products/Applications/Posty.app "dist/Posty-$VERSION.zip"
          (cd dist && shasum -a 256 "Posty-$VERSION.zip" > SHA256SUMS)
          gh release upload "$RELEASE_TAG" "dist/Posty-$VERSION.zip" dist/SHA256SUMS --clobber
          ditto -c -k --keepParent build/Posty.xcarchive build/Posty.xcarchive.zip
      - name: Retain Xcode archive and notarization result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Posty-archive-${{ env.RELEASE_TAG }}
          path: |
            build/Posty.xcarchive.zip
            build/notarization.json
          compression-level: 0
          retention-days: 30
      - name: Check out Homebrew tap
        if: env.PRERELEASE == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coryoso/homebrew
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Update Homebrew cask
        if: env.PRERELEASE == 'false'
        run: |
          # A retry of an older release must not downgrade the tap.
          latest="$(gh release view --json tagName --jq .tagName)"
          [[ "$RELEASE_TAG" == "$latest" ]] || { echo 'Skipping non-latest release'; exit 0; }
          checksum="$(shasum -a 256 "dist/Posty-$VERSION.zip" | awk '{print $1}')"
          mkdir -p homebrew-tap/Casks
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$checksum/g" \
            .github/homebrew/posty.rb.tmpl > homebrew-tap/Casks/posty.rb
          cd homebrew-tap
          ruby -c Casks/posty.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/posty.rb
          if ! git diff --cached --quiet; then
            git commit -m "posty $RELEASE_TAG"
            git pull --rebase
            git push
          fi
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/posty-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/DeveloperIDCA.cer" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/Posty-notarization.zip"
